<!DOCTYPE html>
<html lang="zh-TW">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0, maximum-scale=1.0, user-scalable=no">
    <title>恐龍書法家</title>
    <style>
        /* UI 字體仍從 Google Fonts 載入 */
        @import url('https://fonts.googleapis.com/css2?family=cwTeXYen&family=Zen+Kurenaido&display=swap');

        /* 描紅字體：jsDelivr CDN 線上載入 */
        @font-face {
            font-family: 'Iansui';
            src: url('https://cdn.jsdelivr.net/gh/ButTaiwan/iansui@main/fonts/ttf/Iansui-Regular.ttf') format('truetype');
            font-display: swap;
        }
        @font-face {
            font-family: 'JasonHandwriting';
            src: url('https://cdn.jsdelivr.net/gh/jasonhandwriting/JasonHandwriting@master/JasonHandwriting1.ttf') format('truetype');
            font-display: swap;
        }
        @font-face {
            font-family: 'ChenYuluoyan';
            src: url('https://cdn.jsdelivr.net/gh/Chenyu-otf/chenyuluoyan_thin@main/ChenYuluoyan-2.0-Thin.ttf') format('truetype');
            font-display: swap;
        }
        :root { --bg-color: #FFF3E0; --primary: #FF6B6B; --secondary: #4ECDC4; --text: #2d3436; }
        * { box-sizing: border-box; margin: 0; padding: 0; }
        body {
            font-family: 'cwTeXYen', sans-serif; background-color: var(--bg-color);
            height: 100dvh; display: flex; flex-direction: column; overflow: hidden;
            user-select: none; -webkit-user-select: none;
        }
        .hidden { display: none !important; }

        /* ═══ 頂部列 ═══ */
        .top-bar {
            display: flex; align-items: center; justify-content: space-between;
            padding: 8px 12px; background: white; box-shadow: 0 2px 8px rgba(0,0,0,0.08);
            z-index: 100; flex-shrink: 0;
        }
        .user-btns { display: flex; gap: 6px; }
        .user-btn {
            padding: 5px 14px; border: 2px solid #ddd; border-radius: 20px;
            font-family: inherit; font-size: 0.9rem; font-weight: 600;
            cursor: pointer; background: white; color: #999; transition: all 0.2s;
        }
        .user-btn.active { background: #FFD700; color: #333; border-color: #FFD700; }
        .top-info { display: flex; align-items: center; gap: 10px; }
        .score-badge {
            font-size: 1rem; font-weight: 700; color: var(--primary);
            background: #FFF3CD; padding: 4px 12px; border-radius: 16px;
        }
        .progress-mini { width: 60px; height: 6px; background: #eee; border-radius: 3px; overflow: hidden; }
        .progress-mini-fill { height: 100%; background: linear-gradient(90deg, #FF9F43, #FF6B6B); transition: width 0.5s; }
        .gear-btn {
            width: 36px; height: 36px; border: none; border-radius: 50%;
            background: white; font-size: 1.1rem; cursor: pointer;
            box-shadow: 0 2px 6px rgba(0,0,0,0.1); display: flex;
            align-items: center; justify-content: center;
        }

        /* ═══ 字體切換 ═══ */
        .font-toggle {
            display: flex; gap: 0; border: 2px solid #ddd; border-radius: 16px;
            overflow: hidden; flex-shrink: 0;
        }
        .font-btn {
            padding: 4px 10px; border: none; font-size: 0.8rem; font-weight: 600;
            cursor: pointer; background: white; color: #999; transition: all 0.2s;
        }
        .font-btn.active { background: var(--secondary); color: white; }
        .font-btn:first-child { border-right: 1px solid #ddd; }
        .font-btn:nth-child(2) { border-right: 1px solid #ddd; }

        /* ═══ 設定 Modal ═══ */
        .modal-overlay {
            display: none; position: fixed; inset: 0; z-index: 10000;
            background: rgba(0,0,0,0.4); align-items: center; justify-content: center; padding: 16px;
        }
        .modal-overlay.open { display: flex; }
        .modal {
            background: white; border-radius: 24px; padding: 24px;
            max-width: 420px; width: 100%; max-height: 85vh; overflow-y: auto;
            box-shadow: 0 20px 60px rgba(0,0,0,0.2);
        }
        .modal h2 { font-size: 1.2rem; margin-bottom: 14px; }
        .modal label { font-size: 0.85rem; font-weight: 600; color: #555; display: block; margin-bottom: 5px; }
        .modal textarea, .modal input[type="password"] {
            width: 100%; padding: 10px 14px; border: 2px solid #eee; border-radius: 14px;
            font-family: inherit; font-size: 0.95rem; resize: vertical; outline: none;
        }
        .modal textarea:focus, .modal input:focus { border-color: #FFD700; }
        .modal textarea { min-height: 100px; line-height: 1.6; }
        .modal .hint-text { font-size: 0.72rem; color: #aaa; margin-top: 4px; line-height: 1.4; }
        .modal .section { margin-bottom: 16px; }
        .modal-btns { display: flex; gap: 10px; justify-content: flex-end; margin-top: 16px; }
        .modal-btn {
            padding: 10px 22px; border: none; border-radius: 20px;
            font-family: inherit; font-size: 0.9rem; font-weight: 600; cursor: pointer;
        }
        .modal-btn.save { background: #FFD700; color: #333; }
        .modal-btn.cancel { background: #eee; color: #888; }
        .modal .user-tab-btns { display: flex; gap: 8px; margin-bottom: 12px; }
        .modal .utab {
            padding: 8px 16px; border: 2px solid #ddd; border-radius: 16px;
            font-family: inherit; font-size: 0.9rem; font-weight: 600;
            cursor: pointer; background: white; color: #999;
        }
        .modal .utab.active { background: #FFD700; color: #333; border-color: #FFD700; }

        /* ═══ 遊戲主畫面 ═══ */
        #game-screen {
            display: flex; flex-direction: column; align-items: center;
            flex: 1; padding: 8px; gap: 6px; position: relative;
        }
        .question-area {
            font-size: 1.4rem; color: var(--text); text-align: center;
            background: rgba(255,255,255,0.8); padding: 6px 20px; border-radius: 15px; font-weight: bold;
        }
        .highlight { color: var(--primary); background: #ffeaa7; padding: 0 5px; border-radius: 5px; }
        .char-pills {
            display: flex; gap: 5px; overflow-x: auto; padding: 4px 0;
            scrollbar-width: none; justify-content: center; flex-wrap: wrap;
        }
        .char-pills::-webkit-scrollbar { display: none; }
        .char-pill {
            padding: 4px 10px; border: 2px solid #ddd; border-radius: 14px;
            font-size: 0.8rem; font-weight: 600; background: white; color: #aaa; cursor: pointer;
        }
        .char-pill.active { background: #FFD700; color: #333; border-color: #FFD700; }
        .char-pill.done { background: #00b894; color: white; border-color: #00b894; }

        .canvas-wrapper {
            position: relative; width: 320px; height: 320px; background: white;
            border: 5px solid var(--secondary); border-radius: 15px;
            box-shadow: 0 8px 20px rgba(0,0,0,0.1); cursor: crosshair;
            background-image: linear-gradient(#eee 2px, transparent 2px), linear-gradient(90deg, #eee 2px, transparent 2px);
            background-size: 160px 160px; background-position: center; flex-shrink: 0;
        }
        canvas { position: absolute; top: 0; left: 0; width: 100%; height: 100%; touch-action: none; }
        #hint-canvas { z-index: 1; opacity: 0.8; pointer-events: none; }
        #draw-canvas { z-index: 2; }

        .controls { display: flex; gap: 12px; margin-top: 6px; }
        button {
            border: none; padding: 10px 22px; border-radius: 50px; font-size: 1.1rem;
            font-family: 'cwTeXYen', sans-serif; font-weight: bold; cursor: pointer;
            box-shadow: 0 4px 0 rgba(0,0,0,0.2); transition: transform 0.1s;
            display: flex; align-items: center; gap: 5px;
        }
        button:active { transform: translateY(3px); box-shadow: 0 1px 0 rgba(0,0,0,0.2); }
        .btn-rewrite { background: #ffeaa7; color: #d35400; border: 2px solid #e67e22; }
        .btn-ok { background: #00b894; color: white; border: 2px solid #006266; font-size: 1.3rem; }

        /* 評分覆蓋 */
        .grading-overlay {
            position: absolute; top: 0; left: 0; width: 100%; height: 100%;
            background: rgba(255,255,255,0.9); z-index: 50; display: flex;
            flex-direction: column; justify-content: center; align-items: center;
            border-radius: 15px; font-size: 1.3rem; color: var(--text);
        }
        .spinner { width: 36px; height: 36px; border: 4px solid #eee; border-top: 4px solid var(--primary); border-radius: 50%; animation: spin 1s linear infinite; margin-bottom: 8px; }
        @keyframes spin { to { transform: rotate(360deg); } }

        /* 分數彈窗 */
        .score-popup {
            position: fixed; top: 50%; left: 50%; transform: translate(-50%, -50%) scale(0);
            background: white; padding: 20px 30px; border-radius: 20px; border: 4px solid var(--primary);
            text-align: center; z-index: 200; box-shadow: 0 10px 40px rgba(0,0,0,0.4);
        }
        .score-val-pop { font-size: 3.5rem; font-weight: 900; line-height: 1; display: block; }
        .score-desc { font-size: 1.3rem; font-weight: bold; color: #555; display: block; margin-top: 5px; }
        .anim-perfect { animation: popScale 0.6s forwards; border-color: #ffd700; color: #ffd700; }
        .anim-good { animation: popScale 0.6s forwards; border-color: #FF6B6B; color: #FF6B6B; }
        .anim-normal { animation: popScale 0.6s forwards; border-color: #54a0ff; color: #54a0ff; }
        .anim-bad { animation: shake2 0.5s forwards; border-color: #576574; color: #576574; }
        @keyframes popScale { 0%{transform:translate(-50%,-50%) scale(0)} 80%{transform:translate(-50%,-50%) scale(1.1)} 100%{transform:translate(-50%,-50%) scale(1)} }
        @keyframes shake2 { 0%{transform:translate(-52%,-52%)} 20%{transform:translate(-48%,-48%)} 100%{transform:translate(-50%,-50%) scale(1)} }

        /* OCR Toast */
        .ocr-toast {
            position: fixed; bottom: 80px; left: 50%; transform: translateX(-50%);
            z-index: 20000; padding: 10px 20px; background: white; border-radius: 14px;
            box-shadow: 0 4px 20px rgba(0,0,0,0.2); text-align: center;
            font-family: 'cwTeXYen', sans-serif; animation: slideUp2 0.3s ease;
        }
        @keyframes slideUp2 { from{opacity:0;transform:translateX(-50%) translateY(10px)} to{opacity:1;transform:translateX(-50%) translateY(0)} }
        .ocr-toast .ocr-row { display: flex; align-items: center; gap: 10px; font-size: 1.2rem; }
        .ocr-toast .ocr-seen { font-size: 2rem; font-weight: 800; }
        .ocr-toast .ocr-ok { color: #00b894; }
        .ocr-toast .ocr-ng { color: #FF6B6B; }

        /* 無 Key 警告 */
        .no-key-warning {
            position: fixed; top: 50%; left: 50%; transform: translate(-50%,-50%);
            z-index: 20000; padding: 24px; background: #FFF3CD; border: 2px solid #FFD700;
            border-radius: 20px; box-shadow: 0 10px 40px rgba(0,0,0,0.2);
            text-align: center; max-width: 300px; animation: popScale 0.3s forwards;
        }
        .no-key-warning .nk-icon { font-size: 2.5rem; margin-bottom: 8px; }
        .no-key-warning .nk-title { font-size: 1rem; font-weight: 700; color: #856404; margin-bottom: 8px; }
        .no-key-warning .nk-btn {
            padding: 8px 20px; border: none; border-radius: 16px;
            background: #FFD700; color: #333; font-family: inherit;
            font-size: 0.9rem; font-weight: 600; cursor: pointer;
        }

        /* 十字線 */
        .cross-h { position:absolute; width:100%; height:1px; top:50%; background:rgba(255,0,0,0.3); border-top:1px dashed red; z-index:0; }
        .cross-v { position:absolute; height:100%; width:1px; left:50%; background:rgba(255,0,0,0.3); border-left:1px dashed red; z-index:0; }

        /* 完成提示 */
        .complete-banner {
            position: fixed; top: 50%; left: 50%; transform: translate(-50%,-50%);
            background: white; padding: 30px; border-radius: 24px; border: 4px solid #00b894;
            text-align: center; z-index: 200; box-shadow: 0 10px 40px rgba(0,0,0,0.3);
            animation: popScale 0.5s forwards;
        }
        .complete-banner .cb-emoji { font-size: 3rem; }
        .complete-banner .cb-msg { font-size: 1.3rem; font-weight: 700; color: #00b894; margin: 10px 0; }
        .complete-banner .cb-score { font-size: 2rem; font-weight: 900; color: var(--primary); }
        .complete-banner .cb-btn {
            margin-top: 12px; padding: 10px 24px; border: none; border-radius: 20px;
            background: #FFD700; color: #333; font-family: inherit; font-size: 1rem;
            font-weight: 600; cursor: pointer;
        }
    </style>
</head>
<body>

<!-- 隱藏的字體預載器：強制瀏覽器開始下載所有字體 -->
<div id="font-preloader" style="position:absolute;left:-9999px;top:-9999px;font-size:1px;visibility:hidden;" aria-hidden="true">
    <span style="font-family:'Iansui',serif;">字</span>
    <span style="font-family:'JasonHandwriting',cursive;">字</span>
    <span style="font-family:'ChenYuluoyan',cursive;">字</span>
</div>

<!-- ═══ 設定 Modal ═══ -->
<div class="modal-overlay" id="settings-modal">
    <div class="modal">
        <h2>⚙️ 設定</h2>
        <div class="section">
            <label>選擇使用者的字單</label>
            <div class="user-tab-btns">
                <button class="utab active" id="tab-iggy" onclick="switchSettingsTab('iggy')">🦊 Iggy</button>
                <button class="utab" id="tab-yoyo" onclick="switchSettingsTab('yoyo')">🐸 Yoyo</button>
            </div>
            <textarea id="chars-input" placeholder="每行一個字或詞，例如：&#10;育&#10;博&#10;駐守"></textarea>
            <div class="hint-text">每行一個中文字或詞。詞會自動拆成單字練習。</div>
        </div>
        <div class="section">
            <label>🧠 Gemini API Key（手寫辨識）</label>
            <input type="password" id="gemini-key-input" placeholder="AIza...">
            <div class="hint-text">免費申請：<a href="https://aistudio.google.com/apikey" target="_blank" style="color:#4A90E2">Google AI Studio</a></div>
        </div>
        <div class="section">
            <label>☁️ 跨裝置同步字單</label>
            <div style="display:flex; gap:8px; margin-top:6px;">
                <button class="modal-btn save" onclick="exportShareLink()" style="flex:1; font-size:0.85rem;">📤 產生同步連結</button>
                <button class="modal-btn cancel" onclick="exportText()" style="flex:1; font-size:0.85rem;">📋 複製文字</button>
            </div>
            <div id="share-result" style="margin-top:8px; display:none;">
                <input type="text" id="share-url" readonly style="width:100%; padding:8px 12px; border:2px solid #00b894; border-radius:12px; font-size:0.8rem; background:#e8f8f5;">
                <div class="hint-text" style="color:#00b894; font-weight:600;">✅ 連結已複製！在其他裝置打開就能載入字單。</div>
            </div>
            <div class="hint-text">產生一個包含兩人字單的連結，在其他裝置的瀏覽器打開即可自動匯入。也可用 LINE 傳送給家人。</div>
        </div>
        <div class="modal-btns">
            <button class="modal-btn cancel" onclick="closeSettings()">取消</button>
            <button class="modal-btn save" onclick="saveSettings()">✅ 儲存</button>
        </div>
    </div>
</div>

<!-- ═══ 頂部列 ═══ -->
<div class="top-bar">
    <div class="user-btns">
        <button class="user-btn active" id="ubtn-iggy" onclick="switchUser('iggy')">🦊 Iggy</button>
        <button class="user-btn" id="ubtn-yoyo" onclick="switchUser('yoyo')">🐸 Yoyo</button>
    </div>
    <div class="top-info">
        <div class="font-toggle">
            <button class="font-btn active" id="fbtn-kai" onclick="setFont('kai')">芫荽</button>
            <button class="font-btn" id="fbtn-jason" onclick="setFont('jason')">清松</button>
            <button class="font-btn" id="fbtn-yan" onclick="setFont('yan')">落雁</button>
        </div>
        <div class="score-badge" id="score-badge">0 分</div>
        <div class="progress-mini"><div class="progress-mini-fill" id="progress-fill"></div></div>
    </div>
    <button class="gear-btn" onclick="openSettings()">⚙️</button>
</div>

<!-- ═══ 遊戲畫面 ═══ -->
<div id="game-screen">
    <div class="char-pills" id="char-pills"></div>
    <div class="question-area" id="question-text">載入中...</div>
    <div class="canvas-wrapper" id="game-wrapper">
        <canvas id="hint-canvas"></canvas>
        <canvas id="draw-canvas"></canvas>
        <div class="cross-h"></div>
        <div class="cross-v"></div>
        <div class="grading-overlay hidden" id="grading-overlay">
            <div class="spinner"></div><div>AI 老師檢查中...</div>
        </div>
    </div>
    <div class="controls">
        <button class="btn-rewrite" onclick="rewriteCanvas()">❌ 重寫</button>
        <button class="btn-ok" onclick="submitAnswer()">⭕ 交卷</button>
    </div>
</div>

<script>
    // ══════════════════════════════════════════
    // 全域狀態
    // ══════════════════════════════════════════
    let currentUser = 'iggy';
    let GEMINI_KEY = '';
    let levels = []; // [{char, hint}]
    let currentLevel = 0;
    let totalScore = 0;
    let currentFont = 'kai'; // 'kai' = 芫荽, 'jason' = 清松, 'yan' = 落雁
    const CANVAS_SIZE = 320;

    const FONT_MAP = {
        kai:   "'Iansui', serif",
        jason: "'JasonHandwriting', cursive",
        yan:   "'ChenYuluoyan', cursive"
    };

    function setFont(font) {
        currentFont = font;
        localStorage.setItem('cw-font', font);
        document.querySelectorAll('.font-btn').forEach(b => b.classList.remove('active'));
        document.getElementById('fbtn-' + font).classList.add('active');

        // 取出純字體名（第一個 font-family）
        const fontFamily = FONT_MAP[font].split(',')[0].trim().replace(/'/g, '');

        // 先確保字體已載入，再重新渲染描紅
        document.fonts.load(`240px "${fontFamily}"`, '字').then(() => {
            loadLevel();
        }).catch(() => {
            loadLevel(); // fallback
        });
    }

    const DEFAULT_CHARS = {
        iggy: ['育','博','史','型','功','失','駐','守','勇','兵','附','瞭','頂','標'],
        yoyo: ['大','小','中','上','下','左','右','天','地','人']
    };

    // ══════════════════════════════════════════
    // 使用者切換
    // ══════════════════════════════════════════
    function switchUser(user) {
        currentUser = user;
        localStorage.setItem('cw-current-user', user);
        document.querySelectorAll('.user-btn').forEach(b => b.classList.remove('active'));
        document.getElementById('ubtn-' + user).classList.add('active');
        loadUserData();
        initGame();
    }

    function loadUserData() {
        // 先從 localStorage 載入（瞬間）
        const saved = localStorage.getItem('cw-chars-' + currentUser);
        if (saved) {
            levels = JSON.parse(saved);
        } else {
            const chars = DEFAULT_CHARS[currentUser] || DEFAULT_CHARS.iggy;
            levels = chars.map(c => ({ char: c, hint: c }));
        }

        // ☁️ 背景從雲端同步（如果雲端有較新的資料就更新）
        if (typeof syncFromCloud === 'function') {
            syncFromCloud(currentUser).then(cloudData => {
                if (cloudData && cloudData.length > 0) {
                    const localChars = levels.map(l => l.char).join('');
                    const cloudChars = cloudData.map(l => l.char).join('');
                    if (cloudChars !== localChars) {
                        levels = cloudData;
                        localStorage.setItem('cw-chars-' + currentUser, JSON.stringify(cloudData));
                        console.log('☁️ 雲端字單已同步到本機');
                        renderCharPills();
                        loadLevel();
                    }
                }
            });
        }
    }

    // ══════════════════════════════════════════
    // 設定 Modal
    // ══════════════════════════════════════════
    let settingsTab = 'iggy';

    function openSettings() {
        document.getElementById('settings-modal').classList.add('open');
        settingsTab = currentUser;
        updateSettingsTab();
        document.getElementById('gemini-key-input').value = GEMINI_KEY;
    }
    function closeSettings() { document.getElementById('settings-modal').classList.remove('open'); }

    function switchSettingsTab(user) {
        settingsTab = user;
        updateSettingsTab();
    }
    function updateSettingsTab() {
        document.querySelectorAll('.utab').forEach(b => b.classList.remove('active'));
        document.getElementById('tab-' + settingsTab).classList.add('active');
        const saved = localStorage.getItem('cw-chars-' + settingsTab);
        const ta = document.getElementById('chars-input');
        if (saved) {
            ta.value = JSON.parse(saved).map(l => l.char).join('\n');
        } else {
            ta.value = (DEFAULT_CHARS[settingsTab] || []).join('\n');
        }
    }

    function saveSettings() {
        // 儲存 Gemini Key
        GEMINI_KEY = document.getElementById('gemini-key-input').value.trim();
        localStorage.setItem('cw-gemini-key', GEMINI_KEY);

        // 儲存當前 tab 的字單
        const raw = document.getElementById('chars-input').value.trim();
        if (raw) {
            const chars = raw.split('\n').map(l => l.trim()).filter(Boolean);
            const expanded = [];
            chars.forEach(c => {
                if (c.length > 1) {
                    for (const ch of c) expanded.push({ char: ch, hint: c });
                } else {
                    expanded.push({ char: c, hint: c });
                }
            });
            localStorage.setItem('cw-chars-' + settingsTab, JSON.stringify(expanded));
            // ☁️ 同步到 Firebase
            if (typeof syncToCloud === 'function') syncToCloud(settingsTab, expanded);
        }

        closeSettings();
        loadUserData();
        initGame();
    }

    // ══════════════════════════════════════════
    // 遊戲核心
    // ══════════════════════════════════════════
    const hintCanvas = document.getElementById('hint-canvas');
    const drawCanvas = document.getElementById('draw-canvas');
    const hCtx = hintCanvas.getContext('2d');
    const dCtx = drawCanvas.getContext('2d');
    let isDrawing = false, hasWritten = false;

    function initGame() {
        hintCanvas.width = CANVAS_SIZE; hintCanvas.height = CANVAS_SIZE;
        drawCanvas.width = CANVAS_SIZE; drawCanvas.height = CANVAS_SIZE;
        dCtx.lineCap = 'round'; dCtx.lineJoin = 'round';
        dCtx.lineWidth = 10; dCtx.strokeStyle = '#2d3436';
        currentLevel = 0; totalScore = 0;
        updateScore();
        renderCharPills();
        loadLevel();
    }

    function renderCharPills() {
        const c = document.getElementById('char-pills');
        c.innerHTML = '';
        levels.forEach((l, i) => {
            const pill = document.createElement('span');
            pill.className = 'char-pill' + (i === currentLevel ? ' active' : '');
            pill.textContent = i + 1;
            pill.onclick = () => { currentLevel = i; renderCharPills(); loadLevel(); };
            c.appendChild(pill);
        });
    }

    function loadLevel() {
        if (currentLevel >= levels.length) {
            showComplete();
            return;
        }
        const lvl = levels[currentLevel];
        document.getElementById('question-text').innerHTML =
            lvl.hint.length > 1
            ? lvl.hint.replace(lvl.char, `<span class="highlight">${lvl.char}</span>`)
            : `寫出：<span class="highlight">${lvl.char}</span>`;
        rewriteCanvas();
        renderCharPills();

        // 等字體載入完成再畫描紅底字
        const fontFamily = FONT_MAP[currentFont].split(',')[0].trim().replace(/'/g, '');
        const fontSpec = `240px "${fontFamily}"`;

        // 用目標字觸發字體載入（確保該字的 glyph 被下載）
        document.fonts.load(fontSpec, lvl.char).then(() => {
            drawHint(lvl.char, `240px ${FONT_MAP[currentFont]}`);
        }).catch(() => {
            // 字體載入失敗，等 document.fonts.ready 再試一次
            document.fonts.ready.then(() => {
                drawHint(lvl.char, `240px ${FONT_MAP[currentFont]}`);
            });
        });
    }

    function drawHint(char, fontSpec) {
        hCtx.clearRect(0, 0, CANVAS_SIZE, CANVAS_SIZE);
        hCtx.font = fontSpec;
        hCtx.textAlign = 'center'; hCtx.textBaseline = 'middle';
        hCtx.fillStyle = '#e0e0e0';
        hCtx.fillText(char, CANVAS_SIZE / 2, CANVAS_SIZE / 2);
    }

    // 觸控/滑鼠繪圖
    function getPos(e) {
        const rect = drawCanvas.getBoundingClientRect();
        const cx = e.touches ? e.touches[0].clientX : e.clientX;
        const cy = e.touches ? e.touches[0].clientY : e.clientY;
        return { x: (cx - rect.left) * (drawCanvas.width / rect.width), y: (cy - rect.top) * (drawCanvas.height / rect.height) };
    }
    function startDraw(e) { e.preventDefault(); isDrawing = true; hasWritten = true; const p = getPos(e); dCtx.beginPath(); dCtx.moveTo(p.x, p.y); }
    function draw(e) { if (!isDrawing) return; e.preventDefault(); const p = getPos(e); dCtx.lineTo(p.x, p.y); dCtx.stroke(); }
    function stopDraw() { isDrawing = false; }
    drawCanvas.addEventListener('mousedown', startDraw); drawCanvas.addEventListener('mousemove', draw); drawCanvas.addEventListener('mouseup', stopDraw);
    drawCanvas.addEventListener('touchstart', startDraw, {passive:false}); drawCanvas.addEventListener('touchmove', draw, {passive:false}); drawCanvas.addEventListener('touchend', stopDraw);

    function rewriteCanvas() { dCtx.clearRect(0, 0, CANVAS_SIZE, CANVAS_SIZE); hasWritten = false; }

    // ══════════════════════════════════════════
    // 交卷：像素比對 + Gemini OCR 雙重評分
    // ══════════════════════════════════════════
    async function submitAnswer() {
        if (!hasWritten) { alert('請先寫字喔！✍️'); return; }
        const overlay = document.getElementById('grading-overlay');
        overlay.classList.remove('hidden');

        // 1. 像素重合度評分
        const pixelScore = calculatePixelScore();

        // 2. Gemini OCR 辨識（盲讀）
        let geminiResult = null;
        if (GEMINI_KEY) {
            geminiResult = await recognizeWithGemini();
        }

        overlay.classList.add('hidden');

        // 合併評分
        const target = levels[currentLevel].char;
        let finalScore = pixelScore.points;
        let desc = pixelScore.desc;
        let animClass = pixelScore.animClass;

        // 如果 Gemini 辨識結果與目標不符，扣分
        if (geminiResult !== null) {
            showOcrToast(geminiResult, target);
            if (geminiResult !== target) {
                // AI 認不出來 = 字形差太多，最高只給 5 分
                finalScore = Math.min(finalScore, 5);
                desc = `AI 看成「${geminiResult}」`;
                animClass = 'anim-bad';
            }
        }

        showScorePopup(finalScore, desc, animClass);
        totalScore += finalScore;
        updateScore();

        setTimeout(() => {
            document.querySelector('.score-popup')?.remove();
            currentLevel++;
            loadLevel();
        }, 2500);
    }

    function calculatePixelScore() {
        const hintData = hCtx.getImageData(0, 0, CANVAS_SIZE, CANVAS_SIZE).data;
        const userData = dCtx.getImageData(0, 0, CANVAS_SIZE, CANVAS_SIZE).data;
        let hintPx = 0, userPx = 0, outside = 0;
        for (let i = 0; i < hintData.length; i += 4) {
            const isHint = hintData[i + 3] > 50;
            const isUser = userData[i + 3] > 50;
            if (isHint) hintPx++;
            if (isUser) { userPx++; if (!isHint) outside++; }
        }
        const errorRate = userPx > 0 ? outside / userPx : 1;
        if (errorRate < 0.05) return { points: 12, desc: '神乎其技！', animClass: 'anim-perfect' };
        if (errorRate < 0.50) return { points: 10, desc: '太棒了！', animClass: 'anim-good' };
        if (errorRate < 0.80) return { points: 8, desc: '還不錯！', animClass: 'anim-normal' };
        return { points: 5, desc: '溢出太多囉！', animClass: 'anim-bad' };
    }

    // ══════════════════════════════════════════
    // Gemini 盲讀 OCR
    // ══════════════════════════════════════════
    async function recognizeWithGemini() {
        const imageData = drawCanvas.toDataURL('image/png').split(',')[1];
        const prompt = `你是一個手寫辨識器。一個小朋友在畫布上寫了一個中文字。

你的唯一任務：辨識這個手寫的中文字是什麼。
- 只回傳你看到的那一個中文字。
- 如果看不清楚或不確定，回傳「？」。
- 不要猜測、不要解釋、不要加任何其他文字。
- 回傳 JSON 格式：{"char": "你看到的字"}`;

        try {
            const res = await fetch(
                `https://generativelanguage.googleapis.com/v1beta/models/gemini-2.0-flash:generateContent?key=${GEMINI_KEY}`,
                { method: 'POST', headers: { 'Content-Type': 'application/json' },
                    body: JSON.stringify({
                        contents: [{ parts: [
                            { inlineData: { mimeType: 'image/png', data: imageData } },
                            { text: prompt }
                        ]}]
                    })
                }
            );
            const data = await res.json();
            const text = data.candidates?.[0]?.content?.parts?.[0]?.text || '';
            const clean = text.replace(/```json|```/g, '').trim();
            const parsed = JSON.parse(clean);
            return parsed.char || '？';
        } catch (err) {
            console.error('Gemini OCR error:', err);
            return null;
        }
    }

    // ══════════════════════════════════════════
    // UI 輔助
    // ══════════════════════════════════════════
    function updateScore() {
        document.getElementById('score-badge').textContent = totalScore + ' 分';
        const maxScore = levels.length * 12;
        const pct = maxScore > 0 ? Math.min((totalScore / maxScore) * 100, 100) : 0;
        document.getElementById('progress-fill').style.width = pct + '%';
    }

    function showScorePopup(points, desc, animClass) {
        const div = document.createElement('div');
        div.className = `score-popup ${animClass}`;
        const emoji = points >= 12 ? '🎆' : points >= 10 ? '✨' : points >= 8 ? '👌' : '💧';
        div.innerHTML = `<span class="score-val-pop">+${points}</span><span class="score-desc">${emoji} ${desc}</span>`;
        document.body.appendChild(div);
    }

    function showOcrToast(seen, expected) {
        const isCorrect = seen === expected;
        const toast = document.createElement('div');
        toast.className = 'ocr-toast';
        toast.innerHTML = `<div class="ocr-row">
            <span class="ocr-seen">${seen}</span>
            <span>→</span>
            <span>${expected}</span>
            <span class="${isCorrect ? 'ocr-ok' : 'ocr-ng'}">${isCorrect ? '✅' : '❌'}</span>
        </div>`;
        document.body.appendChild(toast);
        setTimeout(() => toast.remove(), 2500);
    }

    function showComplete() {
        const maxScore = levels.length * 12;
        const banner = document.createElement('div');
        banner.className = 'complete-banner';
        banner.innerHTML = `
            <div class="cb-emoji">🎉🦖</div>
            <div class="cb-msg">全部寫完了！</div>
            <div class="cb-score">${totalScore} / ${maxScore} 分</div>
            <button class="cb-btn" onclick="this.parentElement.remove(); initGame();">🔄 再來一次</button>
        `;
        document.body.appendChild(banner);
    }

    function showNoKeyWarning() {
        if (document.querySelector('.no-key-warning')) return;
        const warn = document.createElement('div');
        warn.className = 'no-key-warning';
        warn.innerHTML = `
            <div class="nk-icon">🔑</div>
            <div class="nk-title">尚未設定 Gemini Key<br>使用像素比對評分</div>
            <button class="nk-btn" onclick="this.parentElement.remove()">知道了</button>
        `;
        document.body.appendChild(warn);
    }

    // ══════════════════════════════════════════
    // 跨裝置同步（URL hash）
    // ══════════════════════════════════════════
    function exportShareLink() {
        // 讀取兩人的字單
        const iggyData = localStorage.getItem('cw-chars-iggy');
        const yoyoData = localStorage.getItem('cw-chars-yoyo');
        const iggyChars = iggyData ? JSON.parse(iggyData).map(l => l.char).join('') : DEFAULT_CHARS.iggy.join('');
        const yoyoChars = yoyoData ? JSON.parse(yoyoData).map(l => l.char).join('') : DEFAULT_CHARS.yoyo.join('');

        // 編碼到 URL hash
        const data = encodeURIComponent(JSON.stringify({ i: iggyChars, y: yoyoChars }));
        const baseUrl = location.href.split('#')[0].split('?')[0];
        const shareUrl = baseUrl + '?sync=' + data;

        // 顯示並複製
        const input = document.getElementById('share-url');
        input.value = shareUrl;
        document.getElementById('share-result').style.display = 'block';
        input.select();
        navigator.clipboard.writeText(shareUrl).catch(() => {
            // fallback: 選中讓使用者手動複製
        });
    }

    function exportText() {
        const iggyData = localStorage.getItem('cw-chars-iggy');
        const yoyoData = localStorage.getItem('cw-chars-yoyo');
        const iggyChars = iggyData ? JSON.parse(iggyData).map(l => l.char).join('\n') : DEFAULT_CHARS.iggy.join('\n');
        const yoyoChars = yoyoData ? JSON.parse(yoyoData).map(l => l.char).join('\n') : DEFAULT_CHARS.yoyo.join('\n');
        const text = `🦊 Iggy 字單：\n${iggyChars}\n\n🐸 Yoyo 字單：\n${yoyoChars}`;
        navigator.clipboard.writeText(text).then(() => {
            alert('✅ 字單已複製到剪貼簿！');
        }).catch(() => {
            prompt('請手動複製：', text);
        });
    }

    function importFromUrl() {
        const params = new URLSearchParams(location.search);
        const syncData = params.get('sync');
        if (!syncData) return false;

        try {
            const data = JSON.parse(decodeURIComponent(syncData));
            if (data.i) {
                const chars = [...data.i].map(c => ({ char: c, hint: c }));
                localStorage.setItem('cw-chars-iggy', JSON.stringify(chars));
            }
            if (data.y) {
                const chars = [...data.y].map(c => ({ char: c, hint: c }));
                localStorage.setItem('cw-chars-yoyo', JSON.stringify(chars));
            }
            // 清除 URL 參數（避免重複匯入）
            history.replaceState(null, '', location.pathname);
            return true;
        } catch (e) {
            console.error('Sync import error:', e);
            return false;
        }
    }

    // ══════════════════════════════════════════
    // 初始化
    // ══════════════════════════════════════════
    window.onload = () => {
        // 檢查 URL 是否有同步資料
        const imported = importFromUrl();
        if (imported) {
            alert('✅ 字單已從連結匯入！');
        }

        GEMINI_KEY = localStorage.getItem('cw-gemini-key') || '';
        currentUser = localStorage.getItem('cw-current-user') || 'iggy';
        currentFont = localStorage.getItem('cw-font') || 'kai';
        document.querySelectorAll('.user-btn').forEach(b => b.classList.remove('active'));
        document.getElementById('ubtn-' + currentUser).classList.add('active');
        document.querySelectorAll('.font-btn').forEach(b => b.classList.remove('active'));
        document.getElementById('fbtn-' + currentFont).classList.add('active');
        loadUserData();
        // 等基本字體載入後再開始遊戲
        document.fonts.ready.then(() => {
            initGame();
        });
        if (!GEMINI_KEY) setTimeout(showNoKeyWarning, 1000);
    };
</script>

<script>
    // ══════════════════════════════════════════
    // Firebase 雲端同步
    // ══════════════════════════════════════════
    const firebaseConfig = {
        apiKey: "AIzaSyAdu9s_EkPr0obWjK6l6uLS-Oca3Lu2uaw",
        authDomain: "screw-inventory.firebaseapp.com",
        projectId: "screw-inventory",
        storageBucket: "screw-inventory.firebasestorage.app",
        messagingSenderId: "551217188475",
        appId: "1:551217188475:web:42ecd142b3734eba5d5cde"
    };
    firebase.initializeApp(firebaseConfig);
    const db = firebase.firestore();

    // 上傳字單到 Firestore
    async function syncToCloud(user, charData) {
        try {
            const chars = charData.map(l => l.char).join('');
            await db.collection('phonics-wordlists').doc(user).set({
                chars: chars,
                updatedAt: firebase.firestore.FieldValue.serverTimestamp()
            });
            console.log('☁️ ' + user + ' 字單已同步到雲端');
        } catch(e) {
            console.warn('雲端同步失敗:', e.message);
        }
    }

    // 從 Firestore 下載字單
    async function syncFromCloud(user) {
        try {
            const doc = await db.collection('phonics-wordlists').doc(user).get();
            if (doc.exists) {
                const chars = [...doc.data().chars];
                const levels = chars.map(c => ({ char: c, hint: c }));
                console.log('☁️ ' + user + ' 字單已從雲端載入 (' + chars.length + '字)');
                return levels;
            }
        } catch(e) {
            console.warn('雲端讀取失敗:', e.message);
        }
        return null;
    }

    // 即時監聽雲端變更（其他裝置更新時自動同步）
    function listenCloudChanges() {
        ['iggy', 'yoyo'].forEach(user => {
            db.collection('phonics-wordlists').doc(user).onSnapshot(doc => {
                if (!doc.exists || !doc.metadata.hasPendingWrites) return;
            }, err => console.warn('監聽失敗:', err.message));
        });
    }
